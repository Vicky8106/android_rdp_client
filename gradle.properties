# JVM Memory Allocation & UTF-8 Encoding
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:CompileCommand=exclude,*ClassReader.readMethod
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:CompileCommand=exclude,*ClassReader.readMethod

# Modern Android Build Flags
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Gradle Performance & Compilation Optimization
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin Code Style
kotlin.code.style=official
